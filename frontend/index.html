<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD con Node y MySQL</title>
    <style>
       body {
      font-family: system-ui, sans-serif;
      max-width: 750px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f9fafb;
    }
    form {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    input {
      flex: 1;
      min-width: 150px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #2563eb;
      color: white;
      font-weight: 500;
    }
    button:hover { background-color: #1d4ed8; }
    ul { list-style: none; padding: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .acciones { display: flex; gap: 6px; }
    .btn-editar { background-color: #f59e0b; }
    .btn-eliminar { background-color: #dc2626; }
    </style>
</head>
<body>
    <h1>Checa los vinilos que hay en inventario</h1>
    <form id="vinilo-form">
        <input type="text" id="nombre-input" placeholder="Nombre del vinilo" required>
        <input type="text" id="artista-input" placeholder="Artista" required>
        <input type="number" id="precio-input" placeholder="Precio" step="0.01" min="0" required>
        <button id="agregar-btn">Agregar vinilo</button>
    </form>
    <ul id="lista-vinilos"></ul>
    <script src="app.js"></script>
</body>
</html>
